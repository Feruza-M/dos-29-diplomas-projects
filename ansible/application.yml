---
- name: Configure application server
  hosts: application
  become: true

  tasks:
    - name: Update apt
      apt:
        update_cache: true

    - name: Install Docker
      apt:
        name:
          - docker.io
          - curl
        state: present

    - name: Start Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu to docker group
      user:
        name: ubuntu
        groups: docker
        append: true
